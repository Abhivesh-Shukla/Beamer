openapi: 3.0.3
info:
  title: Delivery Service API
  description: REST API for managing delivery assignments and updating delivery status lifecycle.
  version: 1.0.0
servers:
  - url: http://localhost:8083
    description: Local development server

paths:
  /deliveries/{id}:
    get:
      summary: Retrieve delivery record by ID
      operationId: getDeliveryById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Delivery details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '404':
          description: Delivery record not found

  /deliveries/{id}/status:
    patch:
      summary: Update delivery status transition
      operationId: updateDeliveryStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeliveryStatusRequest'
      responses:
        '200':
          description: Updated delivery status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '400':
          description: Invalid state transition
        '404':
          description: Delivery record not found

components:
  schemas:
    UpdateDeliveryStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ASSIGNED, PICKED_UP, IN_TRANSIT, DELIVERED]
          description: Target delivery status

    DeliveryResponse:
      type: object
      required:
        - id
        - orderId
        - driverId
        - status
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ASSIGNED, PICKED_UP, IN_TRANSIT, DELIVERED]
        assignedAt:
          type: string
          format: date-time
        pickedUpAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
