openapi: 3.0.3
info:
  title: Order Service API
  description: REST API for creating orders, querying order status, and performing composite order status aggregation.
  version: 1.0.0
servers:
  - url: http://localhost:8081
    description: Local development server

paths:
  /orders:
    post:
      summary: Create a new food order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid request payload

  /orders/{id}:
    get:
      summary: Retrieve order details by ID
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          required: true
          description: Unique Order UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found

  /orders/{id}/full-status:
    get:
      summary: Retrieve composite order status across all microservices
      operationId: getFullOrderStatus
      parameters:
        - name: id
          in: path
          required: true
          description: Unique Order UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Aggregated order lifecycle status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullOrderStatusResponse'
        '404':
          description: Order not found

components:
  schemas:
    CreateOrderRequest:
      type: object
      required:
        - customerId
        - restaurantId
        - items
        - deliveryAddress
        - lat
        - lng
      properties:
        customerId:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRequest'
          minItems: 1
        deliveryAddress:
          $ref: '#/components/schemas/Address'
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180

    OrderItemRequest:
      type: object
      required:
        - menuItemId
        - name
        - quantity
        - unitPrice
      properties:
        menuItemId:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          minimum: 0

    Address:
      type: object
      required:
        - line1
        - city
        - postalCode
      properties:
        line1:
          type: string
        city:
          type: string
        postalCode:
          type: string

    OrderResponse:
      type: object
      required:
        - id
        - customerId
        - restaurantId
        - status
        - items
        - deliveryAddress
        - lat
        - lng
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        status:
          type: string
          enum: [CREATED, ACCEPTED, ASSIGNED, PICKED_UP, IN_TRANSIT, DELIVERED, CANCELLED]
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        deliveryAddress:
          $ref: '#/components/schemas/Address'
        lat:
          type: number
        lng:
          type: number
        createdAt:
          type: string
          format: date-time

    FullOrderStatusResponse:
      type: object
      required:
        - orderId
        - orderStatus
      properties:
        orderId:
          type: string
          format: uuid
        orderStatus:
          type: string
        restaurantDetails:
          type: object
          nullable: true
        deliveryDetails:
          type: object
          nullable: true
        etaDetails:
          type: object
          nullable: true
